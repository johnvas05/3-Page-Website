<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="registerstyle.css">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <nav aria-label="main navigation" class="navbar">
        <div class="mylogo">
            <a href="index.html">
                <img src="mylogo.png">
            </a>
        </div>
    </nav>
    <div class="centered">
        <h1>New Account</h1>
        <br>
        <div class="form-group">
            <label for="textbox">Name:</label>
            <input type="text" id="textbox" name="name" required>
        </div>
        <div class="form-group">
            <label for="textbox">Surname:</label>
            <input type="text" id="textbox" name="surname" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" pattern=".+@example\.com" placeholder="Enter your @example.com email" required>
        </div>
        <div class="form-group">
            <label for="date">Date of birth:</label>
            <input type="date" id="age" name="age">
        </div>
        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="option0">-</option>
                <option value="option1">Male</option>
                <option value="option2">Female</option>
                <option value="option3">Queer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="textbox">Username:</label>
            <input type="text" id="textbox" name="username" placeholder="Enter at least 8 characters" required>
        </div>
        <div class="form-group">
            <label for="textbox">Password:</label>
            <input type="text" id="textbox" name="password" required>
            <small>Enter at least 8 characters, one number</small>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required>
        </div>
        <div class="form-group.button-container">
            <button type="submit" class="button-63">Create Account</button>
        </div>
    </div>
</body>
</html>
